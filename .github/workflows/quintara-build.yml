name: Build Quintara APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Extract Quintara update
        run: |
          unzip -q Quintara-1.1.0-source-update.zip -d /tmp/quintara-update

      - name: Apply Quintara update
        run: |
          python /tmp/quintara-update/apply_quintara_update.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Quintara-APK
          path: build/app/outputs/flutter-apk/app-release.apk
